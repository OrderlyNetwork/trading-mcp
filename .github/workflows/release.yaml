name: release

# Publishing requires an NPM_TOKEN automation token for an account that can
# publish to the @orderly.network scope. The token check below fails fast when
# the secret is missing or invalid.

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  publish-npm:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Verify tag matches package.json
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          if [ "v${VERSION}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "Releasing $VERSION"
      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Show published version
        run: |
          echo "Published: ${GITHUB_REF_NAME}"
          echo "Published: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
